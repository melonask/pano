version = 1

[chains.anvil]
caip2 = "eip155:31337"
rpc_urls = ["http://host.docker.internal:8545"]
confirmations = 1

[chains.solana]
caip2 = "${SOLANA_GENESIS_HASH}"
rpc_urls = ["${SOLANA_RPC_URL}"]
confirmations = 1

[chains.bitcoin]
caip2 = "bip122:0f9188f13cb7b2c71f2a335e3a4fc328"
rpc_urls = ["${BTC_RPC_URL}"]
confirmations = 1

[assets.eth]
chain = "anvil"
symbol = "ETH"
decimals = 18

[assets.usdt]
chain = "anvil"
symbol = "USDT"
contract = "${USDT_CONTRACT}"
decimals = 6

[assets.sol]
chain = "solana"
symbol = "SOL"
decimals = 9

[assets.usdc]
chain = "solana"
symbol = "USDC"
contract = "${USDC_MINT}"
decimals = 6

[assets.btc]
chain = "bitcoin"
symbol = "BTC"
decimals = 8

[stores.pano]
driver = "postgres"
url = "postgres://pano:panopass@postgres:5432/pano"

[pano]
chains = ["anvil", "solana", "bitcoin"]
assets = ["eth", "usdt", "sol", "usdc", "btc"]

[pano.server]
enabled = true

[pano.rpc_defaults]
batch_size = 50
scan_interval_secs = 1
scan_lookback_blocks = 30
max_native_scan_per_cycle = 20
max_retries = 5
retry_base_ms = 200

[pano.ingress.pg]
enabled = true
store = "pano"
poll_interval_secs = 1

[pano.egress.pg]
enabled = true
store = "pano"
