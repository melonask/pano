version = 1

[chains.polygon]
caip2 = "eip155:137"
rpc_urls = ["${POLYGON_RPC_URL}"]
confirmations = 6

[chains.sepolia]
caip2 = "eip155:11155111"
rpc_urls = ["${SEPOLIA_RPC_URL}"]
confirmations = 2

[chains.solana_devnet]
caip2 = "solana:EtWTRABZaYq6iMfeYKouRu166VU2xqa1wcaWoxPkrZBG"
rpc_urls = ["${SOLANA_DEVNET_RPC_URL}"]
confirmations = 1

[assets.polygon_usdc]
chain = "polygon"
symbol = "USDC"
contract = "0x3c499c542cEF5E3811e1192ce70d8cC03d5c3359"
decimals = 6

[assets.sepolia_eth]
chain = "sepolia"
symbol = "ETH"
decimals = 18

[assets.solana_sol]
chain = "solana_devnet"
symbol = "SOL"
decimals = 9

[paths.watches]
kind = "file"
path = "/tmp/watched_addresses.jsonl"

[paths.events]
kind = "file"
path = "/tmp/deposit_events.jsonl"

[pano]
chains = ["polygon", "sepolia", "solana_devnet"]
assets = ["polygon_usdc", "sepolia_eth", "solana_sol"]

[pano.rpc_defaults]
scan_interval_secs = 15
scan_lookback_blocks = 500
scan_timeout_secs = 120
batch_size = 20
max_retries = 2
retry_base_ms = 2000

[pano.ingress.file]
enabled = true
path_ref = "watches"
poll_interval_secs = 30

[pano.egress.file]
enabled = true
path_ref = "events"
