# ──────────────────────────────────────────────────────────────────────────
# Pano — File-based ingress/egress config for live chains
# ──────────────────────────────────────────────────────────────────────────
# Polygon Mainnet, Sepolia Testnet, Solana Devnet
#
# Run:  pano --config tests/e2e/Config.pano.live.toml
#
# Note:
# 1. NEVER USE `polygon-rpc.com` - IT IS NOT ACTIVE!
# 2. Deposits sent before Pano start are missed | Start Pano first, then send deposits
# 3. EVM native coin detection trails ERC-20 | Extend TTL ≥ 120 s; wait 2–3 min
# 4. `spl-token transfer --from` expects account, not keypair | `solana config set --keypair` first
# 5. `spl-token transfer` uses decimal units | `1.0` not `1000000`
# 6. Sepolia `cast send` fails on consecutive calls | `--gas-price 5gwei` on every call
# 7. BTC wallet not loaded after `bitcoind` restart | Delete dir, `createwallet`, re-mine
# ──────────────────────────────────────────────────────────────────────────

# ── Polygon Mainnet (eip155:137) ──────────────────────────────────────────
