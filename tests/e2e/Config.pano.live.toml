    "https://polygon-mainnet.infura.io/v3/895440c3ef614d1e835c6b2f114067e8",
    "https://polygon-mainnet.infura.io/v3/509bcbac52764786a47c41ed3aad7bb6",
    "https://polygon-mainnet.infura.io/v3/59723a3bf359443abd01f46ffc94ceb7",
]

[chains.rpc_options]
scan_interval_secs = 15

[[chains.assets]]
