# ── Solana Devnet ─────────────────────────────────────────────────────────
# Rate limits: 40 req/10s per RPC, 100 req/10s total per IP
# Tuned for ~3 req/s with headroom
[[chains]]
caip2            = "solana:EtWTRABZaYq6iMfeYKouRu166VU2xqa1wcaWoxPkrZBG"
confirmed_blocks = 1
rpc = [
    "https://solana-devnet.g.alchemy.com/v2/pqmbh7GUUW8TL3-W8zdaHusUATir33ZK",
    "https://solana-devnet.g.alchemy.com/v2/y1zYW-ovVofq7OzZo0Z6IHenRnyq_Pbd",
]

[chains.rpc_options]
max_concurrent       = 8
delay_ms             = 100
scan_interval_secs   = 10
scan_lookback_blocks = 500
scan_timeout_secs    = 120
batch_size           = 20
max_retries          = 2
retry_base_ms        = 2000
solana_max_supported_transaction_version = 0

[[chains.assets]]
symbol   = "PYUSD"
decimals = 6
contract = "CXk2AMBfi3TwaEL2468s6zP8xq9NxTXjp9gjMgzeUynM"
token_program = "TokenzQdBNbLqP5VEhdkAS6EPFLC1PHnBqCXEpPxuEb"

[[chains.assets]]
symbol   = "USDC"
decimals = 6
contract = "4zMMC9srt5Ri5X14GAgXhaHii3GnPAEERYPJgZJDncDU"

[[chains.assets]]
symbol   = "SOL"
decimals = 9

# ── Ingress (file) ────────────────────────────────────────────────────────

[ingress.file]
enabled            = true
path               = "/tmp/watched_addresses.jsonl"
poll_interval_secs = 30

# ── Egress (file) ─────────────────────────────────────────────────────────

[egress.file]
enabled = true
path    = "/tmp/deposit_events.jsonl"
