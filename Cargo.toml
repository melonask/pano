[package]
name = "pano"
version = "0.1.2"
edition = "2024"
rust-version = "1.96"
description = "Multi-chain deposit detector — Argos Panoptes sees all"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/melonask/pano"
keywords = ["blockchain", "bitcoin", "balance", "evm", "solana"]
categories = ["cryptography::cryptocurrencies"]

[[bin]]
name = "pano"
path = "src/main.rs"

[features]
# SQLite is the default local persistent integration. Postgres is opt-in via pg.
default = ["sqlite"]
server = ["dep:axum", "dep:tower-http", "dep:tower", "dep:tokio-stream", "dep:hmac", "dep:sha2", "dep:aws-lc-rs"]
webhook = ["dep:hmac", "dep:sha2"]
sqlite = ["dep:sqlx", "sqlx/sqlite"]
postgres = ["dep:sqlx", "sqlx/postgres"]
pg = ["postgres"]
amqp = ["dep:lapin"]
full = ["server", "webhook", "sqlite", "postgres", "amqp"]

[dependencies]
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "signal", "time", "sync", "fs"] }
futures = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml_edit = { version = "0.25", features = ["serde"] }
csv = "1"
async-trait = "0.1"
hex = "0.4"
rust_decimal = { version = "1.42", features = ["serde"] }
num-bigint = "0.4"
solana-pubkey = { version = "4.2", features = ["curve25519", "sha2"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
hashbrown = { version = "0.17", features = ["serde"] }
indexmap = { version = "2", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
ulid = { version = "1.2", features = ["serde"] }
dotenvy = "0.15"
regex-lite = "0.1"
chrono = { version = "0.4", features = ["serde"] }

# Optional integrations.
tokio-stream = { version = "0.1", features = ["sync"], optional = true }
axum = { version = "0.8", features = ["ws", "macros"], optional = true }
tower-http = { version = "0.6", features = ["cors", "trace", "fs"], optional = true }
tower = { version = "0.5", features = ["util"], optional = true }
lapin = { version = "4.10", optional = true }
hmac = { version = "0.13", optional = true }
sha2 = { version = "0.11", optional = true }
aws-lc-rs = { version = "1", optional = true }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio"], optional = true }
url = "2"

[dev-dependencies]
http-body-util = "0.1"
mockito = "1.7"
serial_test = "3"
tempfile = "3"
tokio-test = "0.4"
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "signal", "time", "sync", "fs", "test-util"] }

[lints.rust]
unused_must_use = "deny"
# Documentation standardization target: add public API docs, then enable
# `missing_docs = "warn"` to match the strict documentation posture used by
# crates with complete public item coverage.
